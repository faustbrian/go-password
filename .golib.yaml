schema_version: 1
tool_version: v1.0.14
tool_checksums_sha256: 88341d2f2904925b22ec8de084fec68c5229669f1119f066ed5fccd76aee2f82
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/root.txt
operations:
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: api-docs
        timeout: 5m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzParseEncodedHash$'
        budget: 10s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzBoundedVerify$'
        budget: 10s
        timeout: 2m
  - module: .
    gate: interoperability
    steps:
      - type: make
        makefile: verification/package.mk
        target: interoperability
        timeout: 10m
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: boundaries
        timeout: 5m
      - type: make
        makefile: verification/package.mk
        target: portability
        timeout: 5m
      - type: make
        makefile: verification/package.mk
        target: resource
        timeout: 10m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: ["./..."]
        benchmark: '^BenchmarkApproved'
        budget: 1x
        timeout: 20m
