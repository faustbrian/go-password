schema_version: 1
tool_version: v2.1.1
tool_checksums_sha256: 4e0a38f76cbff547541f3164a0e59e958cf2f62d7b5cea19d7a4d1c51fe5e977
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: .verification
mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json
api:
  baselines:
    - module: .
      mode: apidiff
      path: api/v2.txt
operations:
  - module: .
    gate: local-test
    steps:
      - type: go-test
        packages: ["."]
        run: '^Test(SharedPolicyAndAdmissionAreRaceSafe|AdmissionShutdownWakesQueueAndDrainsWithinContext)$'
        count: 1
        race: true
        timeout: 2m
  - module: .
    gate: conformance
    steps:
      - type: make
        makefile: verification/package.mk
        target: conformance
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: api-docs
        timeout: 5m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzParseEncodedHash$'
        budget: 10s
        timeout: 2m
      - type: go-test
        packages: ["."]
        fuzz: '^FuzzBoundedVerify$'
        budget: 10s
        timeout: 2m
  - module: .
    gate: interoperability
    steps:
      - type: make
        makefile: verification/package.mk
        target: interoperability
        timeout: 10m
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: boundaries
        timeout: 5m
      - type: make
        makefile: verification/package.mk
        target: portability
        timeout: 5m
      - type: make
        makefile: verification/package.mk
        target: resource
        timeout: 10m
  - module: .
    gate: benchmark
    steps:
      - type: go-test
        packages: ["./..."]
        benchmark: '^BenchmarkApproved'
        budget: 1x
        timeout: 20m
