schema_version: 1
tool_version: v1.0.13
tool_checksums_sha256: 164e5c8abefe655958f522677856816faddbd2a8d40eba7d37ba5a031210df70

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

mutation:
  root: .verification/mutation
  imports:
    - module: .
      archive: .verification/mutation/bootstrap/root.zip
      ledger: .verification/mutation/migration-ledger.json

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/root.txt

operations:
  - module: .
    gate: docs
    steps:
      - type: make
        makefile: verification/package.mk
        target: docs
        timeout: 20m
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: boundaries
        timeout: 20m
      - type: make
        makefile: verification/package.mk
        target: portability
        timeout: 20m
      - type: make
        makefile: verification/package.mk
        target: interoperability
        timeout: 20m
      - type: make
        makefile: verification/package.mk
        target: resource
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzParseEncodedHash$'
        budget: 10s
        timeout: 2m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzBoundedVerify$'
        budget: 10s
        timeout: 2m
  - module: .
    gate: benchmark
    steps:
      - type: make
        makefile: verification/package.mk
        target: benchmark
        timeout: 20m
      - type: make
        makefile: verification/package.mk
        target: kubernetes-benchmark
        timeout: 20m
